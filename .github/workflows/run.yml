name: Auto Video Pipeline
on:
  workflow_dispatch:
  repository_dispatch:
    types: [new-video-row]

concurrency:
  group: video
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai FFmpeg va Font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu
          sudo fc-cache -f

      - name: Cai thu vien Python (luon ban moi nhat de tranh loi 403 edge-tts)
        run: pip install -U -r requirements.txt

      - name: Tao file service_account.json tu Secret
        env:
          GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: printf '%s' "$GCP_SA" > service_account.json

      - name: Chay script chinh
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
        run: python main.py
